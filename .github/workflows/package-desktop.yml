name: Package desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            command: package:win
            artifact: Carola-Piola-Windows-x64
            files: release/*.exe
          - runner: macos-14
            command: package:mac
            artifact: Carola-Piola-macOS-arm64
            files: release/*.zip
          - runner: ubuntu-latest
            command: package:linux
            artifact: Carola-Piola-Linux-x64
            files: release/*.AppImage

    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore offline model cache
        uses: actions/cache@v5
        with:
          path: offline-models
          key: kokoro-82m-v1-fp32-q4-dora-v2

      - name: Install dependencies
        run: npm ci

      - name: Download bundled Kokoro model
        run: npm run download:model

      - name: Package
        run: npm run ${{ matrix.command }}

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload apps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME"; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "Carola Piola $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
